# Exemplo de como ligar tudo num docker-compose: nginx na borda (TLS, rate
# limit, etc.) fazendo reverse proxy pro grupo (nosso autoscaler+load
# balancer), que por sua vez descobre e escala os containers do serviço
# "demo". Copie pra docker-compose.yml e ajuste TARGET_SERVICE/porta/policy
# pro seu caso real.
#
# Usa "image" (não "build"): a ideia é buildar a imagem uma vez neste
# repositório (docker build -t autoscaler-group:latest .) e depois só
# referenciá-la pelo nome em qualquer projeto — nenhum outro projeto precisa
# ter o código-fonte do autoscaler por perto. Se publicar num registry
# privado, troque a tag por algo como registry.exemplo.com/autoscaler-group:1.0.0.
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - group-demo

  group-demo:
    image: autoscaler-group:latest
    environment:
      TARGET_SERVICE: demo
      BACKEND_PORT: "80"
      MIN_REPLICAS: "1"
      MAX_REPLICAS: "5"
      CPU_SCALE_UP_PERCENT: "50"
      CPU_SCALE_DOWN_PERCENT: "20"
      # Anti-flapping: só escala depois de N ticks consecutivos fora do
      # limiar, e espera esse tempo entre uma ação de scaling e a próxima.
      SUSTAINED_TICKS: "2"
      COOLDOWN_SECONDS: "30"
      # Tempo que um container escolhido pra scale down fica fora do load
      # balancer antes de ser efetivamente parado (drena requisições em
      # andamento) e tempo que o próprio processo espera, ao receber
      # SIGTERM, pelas requisições HTTP em andamento antes de encerrar.
      DRAIN_TIMEOUT_SECONDS: "10"
      SHUTDOWN_TIMEOUT_SECONDS: "15"
      # Vazio (default) faz só um dial TCP na porta. Se a aplicação expuser
      # uma rota de health check de verdade, defina aqui pra validar o
      # status HTTP em vez de só "a porta abriu".
      HEALTH_CHECK_PATH: "/health"
      # Logs estruturados: "json" (default, bom pra agregadores de log) ou
      # "text" (mais legível rodando local). Nível mínimo: debug, info
      # (default), warn ou error.
      LOG_FORMAT: "json"
      LOG_LEVEL: "info"
    volumes:
      # O grupo precisa falar com o Docker do host pra listar/criar/remover
      # containers e coletar stats — por isso o socket é montado dentro dele.
      - /var/run/docker.sock:/var/run/docker.sock
    # Sem "ports": o nginx é quem fica exposto ao mundo; o grupo só precisa
    # ser alcançável pelo nginx dentro da rede do compose.

# O(s) container(s) do serviço "demo" em si não entram aqui: eles são criados
# e destruídos dinamicamente pelo próprio grupo (executor.scaleUp/scaleDown),
# não fazem parte de um "up" fixo do compose. Precisa existir pelo menos um
# container rodando com a label abaixo pra o grupo usar de molde inicial:
#   docker run -d --label autoscaler.service=demo --name demo-1 nginx:alpine
