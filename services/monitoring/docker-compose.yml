# A "plataforma" de observabilidade: Prometheus + Loki + Promtail + Grafana,
# desacoplados de qualquer projeto específico. Pensado pra subir UMA VEZ e
# ficar de pé, servindo múltiplos projetos ao mesmo tempo.
#
# Suba com: docker compose -f services/monitoring/docker-compose.yml up -d
# (ou, dentro de services/monitoring/: docker compose up -d)
#
# Qualquer projeto que queira métricas coletadas aqui só precisa:
#   1. Se conectar à rede "observability-net" (externa, criada por este compose)
#   2. Expor um /metrics em formato Prometheus
#   3. Ter as labels prometheus.scrape=true e prometheus.port=<porta> no
#      container -- o Prometheus descobre sozinho via docker_sd_configs,
#      sem precisar editar prometheus.yml a cada projeto novo.
# Logs (via Loki/Promtail) já funcionam pra QUALQUER container do host,
# nem precisam estar nesta rede -- o Promtail descobre via socket Docker,
# não via rede (ver promtail/promtail-config.yml).
networks:
  observability-net:
    name: observability-net
    labels:
      # Sem esta label, esta rede fica invisível em GET /v1/networks do
      # launcher (ver services/launcher/internal/dockerclient.ListNetworks,
      # que só lista redes com base-stack.managed=true) -- e por extensão
      # em /admin/networks no portal. Com ela, dá para ligar QUALQUER
      # container (ex: o Traefik do demo) a esta rede pela própria UI
      # ("ligar container"), em vez de precisar de `docker network connect`
      # na linha de comandos.
      base-stack.managed: "true"

  # Só docker-api-ro + Prometheus + Promtail. Sem label base-stack.managed
  # de propósito -- ver a rede docker-api-ro de demo/docker-compose.yml.
  docker-api-ro:
    internal: true

services:
  # Proxy só de leitura à frente do socket do Docker -- mesma razão do
  # docker-api-ro de demo/docker-compose.yml: ":ro" no socket não impede
  # nada, a API continua toda acessível.
  docker-api-ro:
    restart: unless-stopped
    image: tecnativa/docker-socket-proxy:v0.4.0
    environment:
      CONTAINERS: "1" # docker_sd e leitura de logs (/containers/{id}/logs)
      NETWORKS: "1"   # docker_sd do Prometheus lê as redes de cada container
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    cpus: 0.25
    networks:
      - docker-api-ro

  prometheus:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # Só a partir desta máquina: o Prometheus não tem autenticação, e
      # as métricas de todos os projetos passam por aqui. Num servidor,
      # acede-se por túnel SSH (ssh -L 9091:127.0.0.1:9091 ...).
      - "127.0.0.1:9091:9090"
    depends_on:
      - docker-api-ro
    networks:
      - observability-net
      # Auto-descoberta via docker_sd_configs, pelo proxy só de leitura.
      # Também acaba com o group_add do GID do socket, que mudava de host
      # para host.
      - docker-api-ro
    mem_limit: 256m
    cpus: 0.5

  loki:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    image: grafana/loki:latest
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    ports:
      # 3101 no host, não 3100 -- colide com o portal do demo
      # (demo/docker-compose.yml, "3100:3000"). Só afeta acesso direto à
      # API do Loki a partir do host; Grafana/Promtail continuam a falar
      # com ele pelo nome do container ("loki:3100"), nunca por aqui.
      # Só em 127.0.0.1: o Loki não tem autenticação e guarda os logs de
      # todos os projetos.
      - "127.0.0.1:3101:3100"
    networks:
      - observability-net
    mem_limit: 256m
    cpus: 0.5

  promtail:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    image: grafana/promtail:latest
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Sem /var/lib/docker/containers: docker_sd_configs lê os logs pela
      # API, e esse diretório também tem o config.v2.json de cada
      # container, com o Env (segredos) em claro.
    networks:
      - observability-net
      - docker-api-ro
    depends_on:
      - loki
      - docker-api-ro
    mem_limit: 128m
    cpus: 0.3

  grafana:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    image: grafana/grafana:latest
    environment:
      # Login obrigatório. A password vem de GRAFANA_ADMIN_PASSWORD; o
      # default "admin" é só para dev (o Grafana pede para a trocar no
      # primeiro login). Sem volume de dados, o Grafana arranca sempre do
      # zero a partir do provisioning, por isso a variável vale sempre.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Só a partir desta máquina, como o Prometheus e o Loki.
      - "127.0.0.1:3000:3000"
    networks:
      - observability-net
    depends_on:
      - prometheus
      - loki
    # 384m morria por OOM (exit 137) com esta versão do Grafana -- a
    # indexação bleve de dashboards/pastas/etc sozinha já passa disso.
    mem_limit: 768m
    cpus: 0.5
