# A "plataforma" de observabilidade: Prometheus + Loki + Promtail + Grafana,
# desacoplados de qualquer projeto específico. Pensado pra subir UMA VEZ e
# ficar de pé, servindo múltiplos projetos ao mesmo tempo.
#
# Suba com: docker compose -f services/monitoring/docker-compose.yml up -d
# (ou, dentro de services/monitoring/: docker compose up -d)
#
# Qualquer projeto que queira métricas coletadas aqui só precisa:
#   1. Se conectar à rede "observability-net" (externa, criada por este compose)
#   2. Expor um /metrics em formato Prometheus
#   3. Ter as labels prometheus.scrape=true e prometheus.port=<porta> no
#      container -- o Prometheus descobre sozinho via docker_sd_configs,
#      sem precisar editar prometheus.yml a cada projeto novo.
# Logs (via Loki/Promtail) já funcionam pra QUALQUER container do host,
# nem precisam estar nesta rede -- o Promtail descobre via socket Docker,
# não via rede (ver promtail/promtail-config.yml).
networks:
  observability-net:
    name: observability-net
    labels:
      # Sem esta label, esta rede fica invisível em GET /v1/networks do
      # launcher (ver services/launcher/internal/dockerclient.ListNetworks,
      # que só lista redes com base-stack.managed=true) -- e por extensão
      # em /admin/networks no portal. Com ela, dá para ligar QUALQUER
      # container (ex: o Traefik do demo) a esta rede pela própria UI
      # ("ligar container"), em vez de precisar de `docker network connect`
      # na linha de comandos.
      base-stack.managed: "true"

  # Só docker-api-ro + Prometheus + Promtail. Sem label base-stack.managed
  # de propósito -- ver a rede docker-api-ro de demo/docker-compose.yml.
  docker-api-ro:
    internal: true

  # Grafana + quem pode dizer-lhe quem é o utilizador (o portal, que serve
  # o Grafana em /grafana, e o launcher, que sincroniza organizações).
  # O Grafana só aceita o cabeçalho de identidade vindo desta sub-rede
  # (GF_AUTH_PROXY_WHITELIST), por isso nenhuma app lhe pode chegar aqui:
  # sem label base-stack.managed, a rede não aparece no portal.
  grafana-proxy:
    name: grafana-proxy
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  prometheus-data:
  loki-data:

services:
  # Proxy só de leitura à frente do socket do Docker -- mesma razão do
  # docker-api-ro de demo/docker-compose.yml: ":ro" no socket não impede
  # nada, a API continua toda acessível.
  docker-api-ro:
    restart: unless-stopped
    image: tecnativa/docker-socket-proxy:v0.4.0
    environment:
      CONTAINERS: "1" # docker_sd e leitura de logs (/containers/{id}/logs)
      NETWORKS: "1"   # docker_sd do Prometheus lê as redes de cada container
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    cpus: 0.25
    networks:
      - docker-api-ro

  prometheus:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Séries temporais fora do container: recriá-lo (ex: uma config nova)
      # já não apaga o histórico. A retenção continua a ser a de cima.
      - prometheus-data:/prometheus
    ports:
      # Só a partir desta máquina: o Prometheus não tem autenticação, e
      # as métricas de todos os projetos passam por aqui. Num servidor,
      # acede-se por túnel SSH (ssh -L 9091:127.0.0.1:9091 ...).
      - "127.0.0.1:9091:9090"
    depends_on:
      - docker-api-ro
    networks:
      - observability-net
      # Auto-descoberta via docker_sd_configs, pelo proxy só de leitura.
      # Também acaba com o group_add do GID do socket, que mudava de host
      # para host.
      - docker-api-ro
    mem_limit: 256m
    cpus: 0.5

  loki:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    image: grafana/loki:latest
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      # path_prefix do loki-config.yml: chunks, índice e WAL. Sem isto,
      # recriar o container apagava os logs de todos os projetos.
      - loki-data:/loki
    ports:
      # 3101 no host, não 3100 -- colide com o portal do demo
      # (demo/docker-compose.yml, "3100:3000"). Só afeta acesso direto à
      # API do Loki a partir do host; Grafana/Promtail continuam a falar
      # com ele pelo nome do container ("loki:3100"), nunca por aqui.
      # Só em 127.0.0.1: o Loki não tem autenticação e guarda os logs de
      # todos os projetos.
      - "127.0.0.1:3101:3100"
    networks:
      - observability-net
    mem_limit: 256m
    cpus: 0.5

  promtail:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    image: grafana/promtail:latest
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Sem /var/lib/docker/containers: docker_sd_configs lê os logs pela
      # API, e esse diretório também tem o config.v2.json de cada
      # container, com o Env (segredos) em claro.
    networks:
      - observability-net
      - docker-api-ro
    depends_on:
      - loki
      - docker-api-ro
    mem_limit: 128m
    cpus: 0.3

  # Prometheus filtrado por projeto: injeta project="<valor do cabeçalho
  # X-Project>" em TODAS as consultas (incluindo listas de labels). As
  # fontes de dados das organizações de projeto no Grafana apontam para
  # aqui com esse cabeçalho fixo -- quem as usa nunca vê outro projeto.
  prom-label-proxy:
    restart: unless-stopped
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.11.1
    command:
      - -label=project
      - -header-name=X-Project
      - -upstream=http://prometheus:9090
      - -insecure-listen-address=0.0.0.0:8080
      - -enable-label-apis
    depends_on:
      - prometheus
    networks:
      - observability-net
    mem_limit: 64m
    cpus: 0.25

  grafana:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    image: grafana/grafana:latest
    environment:
      # Login obrigatório. A password vem de GRAFANA_ADMIN_PASSWORD; o
      # default "admin" é só para dev (o Grafana pede para a trocar no
      # primeiro login). Sem volume de dados, o Grafana arranca sempre do
      # zero a partir do provisioning, por isso a variável vale sempre.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Login da plataforma: o portal serve o Grafana em /grafana e diz-lhe
      # quem é o utilizador -- X-WEBAUTH-USER é o id da conta (confirmado
      # pelo launcher a partir de um token verificado), e email/nome só para
      # mostrar. Só vale vindo da rede grafana-proxy; o login com password
      # (o admin acima) continua para emergências em localhost:3000/grafana.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: "Email:X-WEBAUTH-EMAIL Name:X-WEBAUTH-NAME"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      # A sub-rede grafana-proxy SEM o gateway (.1): os pedidos que chegam
      # pela porta publicada no host aparecem com o IP do gateway, e esses
      # não podem dizer quem é o utilizador -- senão qualquer processo
      # desta máquina entrava como quem quisesse. Os containers têm .2+.
      GF_AUTH_PROXY_WHITELIST: "172.31.250.2/31, 172.31.250.4/30, 172.31.250.8/29, 172.31.250.16/28, 172.31.250.32/27, 172.31.250.64/26, 172.31.250.128/25"
      # Um utilizador novo cai na organização 1 ("Sem acesso", vazia); é o
      # launcher quem o junta às organizações dos seus projetos.
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ID: "1"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3100/grafana/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Websockets não passam pelo proxy do portal.
      GF_LIVE_MAX_CONNECTIONS: "0"
    # Sem provisioning: fontes de dados e dashboards são criados por
    # organização pelo launcher (internal/grafanasync) -- provisionados
    # aqui iam para a organização 1, onde caem todos os utilizadores
    # novos, e mostravam os dados de todos os projetos.
    ports:
      # Só a partir desta máquina, como o Prometheus e o Loki.
      - "127.0.0.1:3000:3000"
    networks:
      - observability-net
      - grafana-proxy
    depends_on:
      - prometheus
      - loki
    # 384m morria por OOM (exit 137) com esta versão do Grafana -- a
    # indexação bleve de dashboards/pastas/etc sozinha já passa disso.
    mem_limit: 768m
    cpus: 0.5
