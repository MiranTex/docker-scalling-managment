server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # docker_sd_configs descobre automaticamente TODOS os containers Docker
  # do host (não só os do nosso compose) via o socket montado abaixo --
  # mesmo princípio de auto-descoberta que o cAdvisor usa pra métricas.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Nome do container (a API do Docker sempre prefixa com "/")
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      # stdout ou stderr
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
      # Nome do serviço no docker-compose (ex: "group-demo", "prometheus")
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "compose_service"
      # Nome do projeto compose (útil se um dia apontares isto pra outro
      # projeto além deste, ex: "polskamit-mitsui-laravel")
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "compose_project"
