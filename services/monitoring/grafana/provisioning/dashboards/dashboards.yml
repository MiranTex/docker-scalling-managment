# Diz ao Grafana pra carregar qualquer dashboard JSON encontrado na pasta
# /var/lib/grafana/dashboards dentro do container -- é lá que montamos
# grafana/dashboards (ver docker-compose.yml deste serviço).
apiVersion: 1

providers:
  - name: base-stack
    # "Base Stack", não "Autoscaler" -- esta pasta carrega TODO .json em
    # grafana/dashboards, não só o do autoscaler (ver traefik.json, que
    # chegou depois, na mesma pasta).
    folder: Base Stack
    type: file
    options:
      path: /var/lib/grafana/dashboards
