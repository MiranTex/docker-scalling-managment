# Demo end-to-end dos serviços BASE do base-stack -- a plataforma que
# outros serviços vão ser criados a partir de, via templatesadmin+launcher
# (ver "Lançar containers sem autoscaling (launcher)" em demo/README.md),
# não mais um serviço de exemplo escrito à mão no próprio compose. Contém
# auth + portal + database (o Postgres do auth vem do
# services/database -- Postgres partilhado, com backups/PITR via
# pgBackRest, em vez de um `postgres:16-alpine` ad-hoc só deste demo) mais
# secretsadmin/templatesadmin/launcher (gestão de segredos e de modelos de
# serviço, e o serviço que efetivamente lança containers a partir deles).
#
# services/monitoring (Prometheus/Grafana) é uma plataforma separada,
# opcional, e continua a servir qualquer group novo que você venha a criar
# a partir daqui -- ver o README desse serviço para subi-la.
#
# Construa as imagens, se ainda não tiver --
#   docker build -t autoscaler-group:latest services/autoscaler
#   docker build -t auth-service:latest services/auth
#   docker build -t portal:latest services/portal
#   docker build -t database-service:latest services/database
#   docker build -t secretsadmin:latest services/secretsadmin
#   docker build -t templatesadmin:latest services/templatesadmin
#   docker build -t launcher:latest services/launcher
# Depois suba isto:
#   docker compose -f demo/docker-compose.yml up -d
networks:
  auth-net:
    # Nome fixo, não o default prefixado pelo nome do projeto Compose
    # (ex: "demo_auth-net") -- modelos do templatesadmin referenciam este
    # nome literal no campo "network", e quem cria os containers a partir
    # deles é o launcher via API do Docker diretamente, sem passar pelo
    # Compose (que resolveria o prefixo por você).
    name: auth-net
    labels:
      # Mesma label que o launcher aplica a toda rede/container que ele
      # próprio cria (ver services/launcher/internal/dockerclient.PlatformLabel)
      # -- sem isto, esta rede (estática, criada pelo Compose, não pelo
      # launcher) não apareceria em GET /v1/networks nem em /admin/networks,
      # e o launcher trataria QUALQUER rede do host como "nossa" para não
      # ficar sem nada para gerir -- exatamente o oposto do que se quer:
      # nunca listar/gerir a rede de outra app qualquer a partilhar o
      # mesmo host Docker.
      base-stack.managed: "true"

  # Rede da plataforma de observabilidade (ver services/monitoring),
  # externa -- criada por AQUELE compose, não por este. "external: true"
  # torna isto um pré-requisito rígido: suba services/monitoring ANTES de
  # subir este ficheiro, ou "docker compose up" falha inteiro (não só o
  # traefik) por a rede não existir ainda. Ver demo/README.md,
  # "Observabilidade".
  observability-net:
    name: observability-net
    external: true

  # Só o proxy da API do Docker (docker-api-ro) e quem precisa de LER o
  # Docker (traefik, templatesadmin). "internal" corta saída para fora, e
  # nada de label base-stack.managed: sem ela, a rede não aparece em
  # /admin/networks e nenhuma app pode ser ligada a ela -- quem lê a API
  # do Docker lê o Env de todos os containers, ou seja, os segredos.
  docker-api-ro:
    internal: true

services:
  # Proxy à frente do socket do Docker que só deixa passar GETs dos
  # endpoints listados abaixo (POST=0 é o default). Montar o socket com
  # ":ro" NÃO protege nada -- só torna o ficheiro só de leitura, a API
  # continua a aceitar criar containers privilegiados. Só o launcher
  # continua com o socket direto, por ser quem cria containers.
  docker-api-ro:
    restart: unless-stopped
    image: tecnativa/docker-socket-proxy:v0.4.0
    environment:
      CONTAINERS: "1" # traefik: descoberta de containers e labels
      NETWORKS: "1"   # traefik: IP do container na rede escolhida
      IMAGES: "1"     # templatesadmin: GET /v1/images
      INFO: "1"
      # EVENTS, PING e VERSION já vêm ligados por defeito (traefik usa os três).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    cpus: 0.25
    networks:
      - docker-api-ro

  # Gateway único de acesso externo: publica a ÚNICA porta do host em toda
  # a plataforma (80). Nenhum container passa a publicar porta própria --
  # continuam só na rede interna, como hoje; é o Traefik quem decide para
  # onde reencaminhar, lendo labels Docker que o launcher escreve (ver
  # services/launcher/internal/httpapi, labelExposeHost) quando uma
  # instância/group pede para ser exposta.
  traefik:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    # v3.6.1+ é obrigatório aqui -- versões anteriores têm a versão da API
    # do Docker fixa em 1.24 no seu provider, e o Docker Engine 29+ deixou
    # de aceitar qualquer coisa abaixo de 1.44 ("client version 1.24 is too
    # old"). v3.6.1 introduziu a negociação automática que resolve isto.
    image: traefik:v3.6.1
    # Nome fixo -- é por ele que o launcher liga o Traefik a uma rede nova
    # (ver handleCreateNetwork), sem precisar descobrir o nome do container.
    container_name: traefik
    command:
      - --providers.docker=true
      # Lê o Docker através do proxy só de leitura (ver docker-api-ro),
      # nunca do socket direto.
      - --providers.docker.endpoint=tcp://docker-api-ro:2375
      # Crítico: sem isto, o Traefik tentaria expor QUALQUER container
      # visível pelo socket, inclusive de outra app vossa não relacionada
      # -- mesmo cuidado do isolamento por base-stack.managed. Só um
      # container com "traefik.enable=true" (escrito pelo launcher) é
      # roteado.
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=auth-net
      - --entrypoints.web.address=:80
      # HTTPS -- sempre disponível neste entrypoint, mas só usado por uma
      # instância que o launcher tenha exposto com PUBLIC_TLS_CERT_RESOLVER
      # preenchido (ver serviço "launcher" abaixo); sem isso, o Traefik
      # nunca recebe um router com "tls.certresolver", e este entrypoint
      # fica simplesmente sem tráfego nenhum -- publicá-lo aqui é inofensivo.
      - --entrypoints.websecure.address=:443
      # Resolver ACME chamado "le" -- é este nome que PUBLIC_TLS_CERT_RESOLVER
      # tem de repetir. Desligado por padrão no sentido em que NENHUM
      # router o usa até alguém preencher PUBLIC_TLS_CERT_RESOLVER; ainda
      # assim o challenge HTTP-01 exige o domínio (PUBLIC_BASE_DOMAIN)
      # resolvendo para um IP publicamente alcançável na porta 80 -- não
      # funciona com "127.0.0.1.nip.io" (loopback), só com um domínio real
      # (ou um nip.io montado sobre o IP público real do host).
      - --certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # CA de staging da Let's Encrypt por defeito -- emite certificados
      # que o browser não confia, mas sem os limites de taxa da CA de
      # produção (fáceis de esgotar enquanto se testa a configuração). Só
      # trocar para a de produção (comentada abaixo) depois de confirmar
      # que o challenge HTTP-01 está mesmo a passar contra a de staging.
      - --certificatesresolvers.le.acme.caserver=${TRAEFIK_ACME_CA_SERVER:-https://acme-staging-v2.api.letsencrypt.org/directory}
      # Produção: https://acme-v02.api.letsencrypt.org/directory
      # Access logs (um por pedido, JSON) por stdout -- é o suficiente para
      # o Promtail da plataforma de observabilidade (ver services/monitoring)
      # os coletar sozinho, já que ele lê o stdout/stderr de TODO container
      # do host, sem precisar de nenhuma config nova do lado dele.
      - --accesslog=true
      - --accesslog.format=json
      # Métricas Prometheus nativas -- entrypoint PRÓPRIO ("metrics"),
      # nunca publicado no host (ver "ports" abaixo, sem 8082), só
      # alcançável de dentro de uma rede Docker partilhada com quem faz
      # scrape. Isolar num entrypoint à parte evita expor /metrics no
      # mesmo domínio/porta público de uma app.
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Persiste os certificados emitidos (acme.json) entre reinícios --
      # sem isto, cada restart do Traefik pediria certificados novos a
      # todo host exposto, batendo cedo nos limites de taxa da CA.
      - traefik-acme:/letsencrypt
    labels:
      base-stack.managed: "true"
      # Convenção da plataforma de observabilidade (ver
      # services/monitoring/docker-compose.yml) -- o Prometheus lá descobre
      # este container via docker_sd_configs por causa destas duas labels,
      # já ligado à rede "observability-net" abaixo desde a criação.
      prometheus.scrape: "true"
      prometheus.port: "8082"
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - docker-api-ro
    networks:
      - auth-net
      - docker-api-ro
      # Externa (ver bloco "networks" no topo do ficheiro) -- é o que dá ao
      # Prometheus da plataforma de observabilidade acesso de rede a este
      # container (a label sozinha não basta, bridge networks do Docker
      # isolam IP entre si). Descoberta funciona por NOME (Prometheus
      # resolve "traefik" via DNS interno do Docker nesta rede -- ver
      # services/monitoring/prometheus/prometheus.yml), não por IP, então a
      # ordem desta lista ou qual rede é "primária" para o Docker não
      # importa aqui.
      - observability-net

  # Postgres partilhado (services/database) -- substitui o
  # `postgres:16-alpine` ad-hoc que este demo subia antes só pro auth.
  # Já vem com backups em rotina + PITR (pgBackRest) e Adminer, mesmo
  # aqui no demo -- ver services/database/README.md.
  database:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    build: ../services/database
    image: database-service:latest
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app # dev only -- ver services/database/README.md
      PGBACKREST_STANZA: demo
      # dbadmin (API de administração desta BD, ver
      # services/database/README.md) valida tokens do auth service via
      # JWKS -- por isso ele fala com o auth, não com o Postgres
      # diretamente, para saber quem está autorizado a chamá-lo.
      AUTH_SERVICE_URL: "http://auth:8080"
      # Têm de bater exatamente com o AUTH_ISSUER/AUTH_AUDIENCE deste demo
      # (ver o serviço "auth" abaixo) -- senão todo token é rejeitado
      # por issuer inesperado, mesmo com assinatura e role corretas.
      AUTH_ISSUER: "auth.base-stack.local"
      AUTH_AUDIENCE: "base-stack"
      DBADMIN_PROVISIONED_DB_HOST: database
      DBADMIN_PROVISIONED_DB_PORT: "5432"
      DBADMIN_PROVISIONED_DB_SSLMODE: disable
    labels:
      base-stack.managed: "true"
    volumes:
      - demo-database-data:/var/lib/postgresql/data
      - demo-database-backup-repo:/var/lib/pgbackrest
      # Provisiona a role "auth" na primeira inicialização (ver
      # demo/db-init/01-auth-role.sql) -- é assim que um serviço novo
      # ganha acesso ao Postgres partilhado sem o services/database
      # precisar saber nada sobre ele.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    networks:
      - auth-net

  # Guarda valores de segredos (ex: senhas de BD usadas em launch
  # templates do autoscaler) cifrados em repouso -- ver
  # services/secretsadmin. Só infra-admin (via portal) gere nomes/valores;
  # só contas "service" (na prática, o launcher, ver
  # LAUNCHER_SECRETS_REFRESH_TOKEN abaixo) conseguem resolver um nome para
  # o valor em claro.
  secretsadmin:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    build: ../services/secretsadmin
    image: secretsadmin:latest
    environment:
      SECRETSADMIN_DATABASE_URL: "postgres://secretsadmin:secretsadmin@database:5432/app?sslmode=disable"
      AUTH_SERVICE_URL: "http://auth:8080"
      AUTH_ISSUER: "auth.base-stack.local"
      AUTH_AUDIENCE: "base-stack"
      # Chave de cifra (AES-256, 32 bytes em base64) -- dev only, gerada
      # com `openssl rand -base64 32`. Perder isto torna todos os
      # segredos já gravados irrecuperáveis; ver internal/crypto.
      SECRETS_MASTER_KEY: "dYqiYX4FVzR2YzOtaCVk1lJuscTZf1ewnLZORaqqgWc="
    labels:
      base-stack.managed: "true"
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    networks:
      - auth-net

  # Gerador de configuração para novos serviços autoscalados: guarda
  # "modelos de serviço" (launch template + config de grupo) num
  # Postgres próprio e devolve, prontos, o launch-template.json e o
  # bloco YAML do group correspondente -- ver
  # services/templatesadmin/README.md e demo/README.md, "Criar um novo
  # serviço autoscalado". NÃO cria containers sozinho: só lista imagens
  # (GET /v1/images), através do proxy só de leitura (docker-api-ro).
  templatesadmin:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    build: ../services/templatesadmin
    image: templatesadmin:latest
    environment:
      TEMPLATESADMIN_DATABASE_URL: "postgres://templatesadmin:templatesadmin@database:5432/app?sslmode=disable"
      DOCKER_SOCKET: "tcp://docker-api-ro:2375"
      AUTH_SERVICE_URL: "http://auth:8080"
      AUTH_ISSUER: "auth.base-stack.local"
      AUTH_AUDIENCE: "base-stack"
    labels:
      base-stack.managed: "true"
    depends_on:
      database:
        condition: service_healthy
      docker-api-ro:
        condition: service_started
    mem_limit: 128m
    cpus: 0.25
    networks:
      - auth-net
      - docker-api-ro

  # O único serviço que efetivamente cria containers a partir de um
  # modelo -- instâncias "solo" (uma app qualquer, sem autoscaling nenhum)
  # ou "group" (um autoscaler-group inteiro, lançado sem passar pelo
  # docker-compose). É também o único que resolve ${secret:NOME} contra o
  # secretsadmin -- ver demo/README.md.
  launcher:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    build: ../services/launcher
    image: launcher:latest
    environment:
      LAUNCHER_DATABASE_URL: "postgres://launcher:launcher@database:5432/app?sslmode=disable"
      AUTH_SERVICE_URL: "http://auth:8080"
      AUTH_ISSUER: "auth.base-stack.local"
      AUTH_AUDIENCE: "base-stack"
      TEMPLATESADMIN_SERVICE_URL: "http://templatesadmin:8093"
      SECRETSADMIN_SERVICE_URL: "http://secretsadmin:8092"
      # Conta "service" própria do launcher (ver demo/README.md, "Bootstrap
      # da conta de serviço do autoscaler").
      LAUNCHER_SECRETS_REFRESH_TOKEN: "${LAUNCHER_SECRETS_REFRESH_TOKEN:-}"
      # Nome fixo, alcançável por qualquer group que este launcher venha a
      # criar dinamicamente (ver internal/httpapi.GroupConfig.SelfURL).
      LAUNCHER_SELF_URL: "http://launcher:8094"
      AUTOSCALER_GROUP_IMAGE: "autoscaler-group:latest"
      # Domínio base para instâncias/groups expostos publicamente (ver
      # internal/httpapi, resolveExposeLabels) -- "<slug>.<isto>" é o host
      # completo escrito nas labels do Traefik. nip.io é um serviço de DNS
      # público real que resolve QUALQUER "algo.127.0.0.1.nip.io" para
      # 127.0.0.1 -- funciona em dev sem editar /etc/hosts nem ter domínio
      # próprio; troque por um domínio real em produção.
      PUBLIC_BASE_DOMAIN: "${PUBLIC_BASE_DOMAIN:-127.0.0.1.nip.io}"
      # Nome do certResolver Traefik (ver serviço "traefik" acima) a usar
      # em toda instância exposta a partir de agora -- "" (default) mantém
      # tudo só em HTTP, exatamente como antes desta feature existir.
      # Preencher com "le" liga HTTPS/ACME para instâncias novas (as já
      # expostas antes da mudança continuam em HTTP até serem recriadas --
      # ver demo/README.md, "HTTPS/TLS (ACME)").
      PUBLIC_TLS_CERT_RESOLVER: "${PUBLIC_TLS_CERT_RESOLVER:-}"
      # Tamanho aplicado quando nem o pedido nem o modelo escolhem um (ver
      # internal/httpapi/capacity.go). Os nomes vêm do catálogo em
      # services/templatesadmin (service_templates.instance_types).
      LAUNCHER_DEFAULT_INSTANCE_TYPE: "${LAUNCHER_DEFAULT_INSTANCE_TYPE:-t1.small}"
      LAUNCHER_GROUP_INSTANCE_TYPE: "${LAUNCHER_GROUP_INSTANCE_TYPE:-t1.micro}"
      # Capacidade física declarada deste host. Vazio/zero (default)
      # desliga a contabilidade: os limites por container continuam a ser
      # aplicados, mas nada é recusado por falta de espaço. Definir
      # LAUNCHER_HOST_MEMORY_MB liga o bloqueio -- só de memória, nunca de
      # CPU (ver o package doc de internal/httpapi/capacity.go).
      LAUNCHER_HOST_VCPU: "${LAUNCHER_HOST_VCPU:-}"
      LAUNCHER_HOST_MEMORY_MB: "${LAUNCHER_HOST_MEMORY_MB:-}"
      # Prefixos de caminhos do HOST que um modelo pode montar em "binds",
      # separados por vírgula (ex: "/Users/eu/code" para código-fonte em
      # dev). Vazio (default) = só volumes nomeados. /etc, /proc, /var/run,
      # /var/lib/docker, o socket, etc. ficam proibidos mesmo dentro de um
      # prefixo daqui -- ver services/launcher/internal/httpapi/specpolicy.go.
      LAUNCHER_ALLOWED_BIND_PATHS: "${LAUNCHER_ALLOWED_BIND_PATHS:-}"
      # Cifra os segredos de ambiente dos projetos (AES-256, 32 bytes em
      # base64) -- dev only, gerada com `openssl rand -base64 32`. Perder
      # isto torna esses segredos irrecuperáveis. Separada da
      # SECRETS_MASTER_KEY do secretsadmin de propósito.
      LAUNCHER_SECRETS_KEY: "${LAUNCHER_SECRETS_KEY:-Gb6oAL1A3uEIJGpHTDeN4YkGTQzI3LDAlii+jX18x6o=}"
    labels:
      base-stack.managed: "true"
    volumes:
      # Este é quem, de facto, fala com o Docker para criar/iniciar/parar
      # containers -- o único serviço da plataforma com o socket direto.
      # Tudo o que cria passa por SpecPolicy (binds, rede).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    networks:
      - auth-net
    # Default do Docker (10s) não chega para drenar os pedidos HTTP em
    # curso (15s, ver cmd/launcher/main.go). O launcher já não derruba os
    # groups ao desligar -- ver "Derrubar" em demo/README.md.
    stop_grace_period: 20s

  # Só para dev: browser de tabelas + SQL ad-hoc contra o Postgres
  # partilhado. Nunca exponha esta porta fora da tua máquina/rede de
  # confiança (Adminer não tem rate-limit nem MFA próprios).
  adminer:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      # 8096, não 8081/8082 -- já usados pelo auth e pelo
      # services/database standalone respetivamente.
      - "8096:8080"
    labels:
      base-stack.managed: "true"
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    networks:
      - auth-net

  # Auth service: um container estático, como o resto do plano de
  # controlo. Já foi um autoscaler-group (group-authd), mas o group
  # dependia de renovar o seu token contra o auth que ele próprio geria --
  # com zero réplicas, nunca conseguia pedir a primeira (deadlock a cada
  # arranque a frio). O plano de controlo não pode depender de si próprio
  # para arrancar.
  #
  # Um só container de propósito: com o volume auth-signing-key ainda
  # vazio, duas instâncias a arrancar ao mesmo tempo gerariam cada uma a
  # sua chave de assinatura (ver internal/keystore.LoadOrGenerate em
  # services/auth).
  auth:
    restart: unless-stopped
    image: auth-service:latest
    environment:
      AUTH_DATABASE_URL: "postgres://auth:auth@database:5432/app?sslmode=disable"
      # Têm de bater com AUTH_ISSUER/AUTH_AUDIENCE de todo serviço que
      # valida tokens (dbadmin, secretsadmin, templatesadmin, launcher).
      AUTH_ISSUER: "auth.base-stack.local"
      AUTH_AUDIENCE: "base-stack"
      LOG_FORMAT: "json"
      LOG_LEVEL: "info"
      # Promove esta conta a super-admin no arranque, se já existir -- só
      # precisa de estar definido uma vez (ver demo/README.md, passo 4).
      AUTH_BOOTSTRAP_SUPERADMIN_EMAIL: "${AUTH_BOOTSTRAP_SUPERADMIN_EMAIL:-}"
    labels:
      base-stack.managed: "true"
    volumes:
      - auth-signing-key:/var/lib/auth
    ports:
      # Mesma porta no host de sempre (era o proxy do group-authd).
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    networks:
      - auth-net

  portal:
    # Volta a subir depois de um crash ou reboot do host; um "docker
    # compose stop" explícito continua a ser respeitado.
    restart: unless-stopped
    image: portal:latest
    environment:
      AUTH_SERVICE_URL: "http://auth:8080"
      # dbadmin corre dentro do próprio container "database" (ver
      # services/database/README.md, "API de administração") -- não tem
      # porta publicada no host de propósito, só acessível dentro da
      # rede auth-net.
      DBADMIN_SERVICE_URL: "http://database:8091"
      # secretsadmin corre dentro da rede auth-net só, sem porta
      # publicada no host, mesmo espírito do DBADMIN_SERVICE_URL acima.
      SECRETSADMIN_SERVICE_URL: "http://secretsadmin:8092"
      # Idem para templatesadmin -- ver /admin/templates e
      # demo/README.md, "Criar um novo serviço autoscalado".
      TEMPLATESADMIN_SERVICE_URL: "http://templatesadmin:8093"
      # Idem para o launcher -- ver /admin/launcher e demo/README.md,
      # "Lançar containers sem autoscaling (launcher)".
      LAUNCHER_SERVICE_URL: "http://launcher:8094"
    labels:
      base-stack.managed: "true"
    ports:
      # 3100 no host, não 3000 -- o Grafana da plataforma de observabilidade
      # já usa 3000 (ver services/monitoring).
      - "3100:3000"
    depends_on:
      - auth
      - database
      - secretsadmin
      - templatesadmin
      - launcher
    mem_limit: 256m
    cpus: 0.5
    networks:
      - auth-net

volumes:
  demo-database-data:
  demo-database-backup-repo:
  traefik-acme:
  # Nome fixo, sem o prefixo do projeto: é o mesmo volume que as réplicas
  # do antigo group-authd montavam, por isso a chave de assinatura (e todo
  # token já emitido) sobrevive à mudança. Num volume que já existia, o
  # compose avisa que não foi ele que o criou -- é inofensivo.
  auth-signing-key:
    name: auth-signing-key
