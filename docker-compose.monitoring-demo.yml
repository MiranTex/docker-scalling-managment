# O projeto em si (autoscaler): backend + group, desacoplados da
# plataforma de observabilidade (docker-compose.observability.yml).
#
# Pré-requisito: suba a plataforma primeiro --
#   docker compose -f docker-compose.observability.yml up -d
# Depois suba isto:
#   docker compose -f docker-compose.monitoring-demo.yml up -d
#
# group-demo se conecta à rede externa "observability-net" (criada pelo
# compose da plataforma) e carrega as labels prometheus.scrape/port --
# é só isso que o Prometheus precisa pra descobrir e escrapear sozinho.
networks:
  observability-net:
    external: true

services:
  # Container "molde" inicial do serviço "demo" -- o group clona a partir
  # dele quando decide escalar. nginx:alpine só pra ter algo respondendo
  # HTTP na porta 80, suficiente pro health check e pro proxy funcionarem.
  demo-backend:
    image: nginx:alpine
    labels:
      autoscaler.service: "demo"
    networks:
      - observability-net

  group-demo:
    image: autoscaler-group:latest
    environment:
      TARGET_SERVICE: demo
      BACKEND_PORT: "80"
      MIN_REPLICAS: "1"
      MAX_REPLICAS: "5"
      CPU_SCALE_UP_PERCENT: "50"
      CPU_SCALE_DOWN_PERCENT: "20"
      RECONCILE_TICK_SECONDS: "3"
      LOG_FORMAT: "json"
      LOG_LEVEL: "debug"
      METRICS_ADDR: ":9090"
    labels:
      # É isto que faz o Prometheus da plataforma descobrir este container
      # sozinho (docker_sd_configs), sem precisar editar prometheus.yml.
      prometheus.scrape: "true"
      prometheus.port: "9090"
    ports:
      # Proxy (pra você bater requisições reais no serviço "demo").
      # Usa 8095 no host porque a 8090 já está ocupada por outro projeto teu.
      - "8095:8090"
      # /healthz, /readyz, /metrics. Usa 9095 no host pelo mesmo motivo
      # (9090 já está ocupada por outro projeto teu).
      - "9095:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - observability-net
    depends_on:
      - demo-backend
